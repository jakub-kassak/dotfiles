# espanso match file — mathematical symbols
#
# Type the trigger (e.g. ;sigma) and a trailing word separator (space,
# punctuation) to expand it to the Unicode symbol (σ). The `;` prefix avoids
# clashing with real LaTeX commands. LaTeX-named triggers use `word: true` so
# they only fire at a word boundary — this lets long triggers like ;llbracket
# complete instead of being shadowed by the shorter ;ll. The `word: true`
# matching uses espanso's keystroke buffer, so it still works in terminals/nvim.
#
# Exceptions kept as plain (non-word) triggers so they can fire right after a
# letter: the ;_x / ;^x glyph-composition family (e.g.  l;_x -> lₓ).
# The ' -prefix regex triggers (dynamic sub/superscripts) are separate and
# GUI-only (regex matching needs cursor context terminals don't expose).
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

