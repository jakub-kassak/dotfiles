  # ------------------------------------------------------------------
  # Dynamic sub/superscripts (regex, ' prefix)
  #
  # A second prefix ' marks regex triggers that capture the text in
  # parentheses. e.g.  'ell_(body) -> ℓ_body ,  'x_(n) -> x_n ,
  # 'T^(ij) -> T^ij. NOTE: regex triggers need cursor context, so these
  # generally fire in GUI editors but NOT in nvim/terminals — use the
  # ; glyph triggers above for nvim.
  # ------------------------------------------------------------------
  # Symbol-specific subscripts (base name -> its Unicode glyph).
  # 'name_(text) converts every char in (text) to a Unicode SUBSCRIPT
  # glyph where one exists (partial: b c d f g q w y z have no subscript).
  - regex: "'alpha_\\((?P<sub>[^)]+)\\)"
    replace: "α{{subconv}}"
    vars:
      - name: subconv
        type: shell
        params:
          cmd: "python3 \"$HOME/Library/Application Support/espanso/scripts/mathconv.py\" sub \"{{sub}}\""
  - regex: "'beta_\\((?P<sub>[^)]+)\\)"
    replace: "β{{subconv}}"
