# Type a shortcut followed by a space to insert an emoji and a space.
matches:
  - trigger: ";done "
    replace: "✅ "
  - trigger: ";yes "
    replace: "👍 "
  - trigger: ";no "
    replace: "❌ "
  - trigger: ";warn "
    replace: "⚠️ "
  - trigger: ";wait "
    replace: "⏳ "
  - trigger: ";eyes "
    replace: "👀 "
  - trigger: ";idea "
    replace: "💡 "
  - trigger: ";pin "
    replace: "📌 "
  - trigger: ";target "
    replace: "🎯 "
  - trigger: ";launch "
    replace: "🚀 "
  - trigger: ";party "
    replace: "🎉 "
  - trigger: ";thanks "
    replace: "🙏 "
  - trigger: ";smile "
    replace: "🙂 "
  - trigger: ";laugh "
    replace: "😂 "
  - trigger: ";think "
    replace: "🤔 "
  - trigger: ";heart "
    replace: "❤️ "
  - trigger: ";wave "
    replace: "👋 "
  - trigger: ";coffee "
    replace: "☕ "
