# Reference: https://github.com/i3/i3/blob/next/etc/config

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# exec-on-workspace-change = [
#     '/bin/bash',
#     '-c',
#     '/opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_workspace_change AEROSPACE_FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE AEROSPACE_PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
# ]

# Start AeroSpace at login
start-at-login = true

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# on-focus-changed = "move-mouse window-lazy-center"

[gaps]
inner.horizontal = 2
inner.vertical = 2
outer.left = 2
outer.bottom = 2
outer.top = 2        # [{monitor.built-in = 2}, 35]
outer.right = 2

[mode.main.binding]
# See: https://nikitabobko.github.io/AeroSpace/goodness#open-a-new-window-with-applescript
# cmd-ctrl-alt-t = 'exec-and-forget wezterm cli spawn --new-window'
cmd-ctrl-alt-b = 'exec-and-forget open -n -a "Brave Browser"'
cmd-ctrl-alt-shift-enter = 'exec-and-forget open -n -a "Brave Browser"'
cmd-ctrl-alt-enter = 'exec-and-forget open -n -a wezterm'
# cmd-ctrl-alt-c = 'exec-and-forget open -a "Commander one"'

cmd-ctrl-alt-h = 'focus left'
cmd-ctrl-alt-j = 'focus down'
cmd-ctrl-alt-k = 'focus up'
cmd-ctrl-alt-l = 'focus right'

cmd-ctrl-alt-shift-h = 'move left'
cmd-ctrl-alt-shift-j = 'move down'
cmd-ctrl-alt-shift-k = 'move up'
cmd-ctrl-alt-shift-l = 'move right'

# Consider using 'join-with' command as a 'split' replacement if you want to enable normalizations
# alt-c = 'split horizontal'
# alt-v = 'split vertical'

cmd-ctrl-alt-f = 'fullscreen'
cmd-ctrl-alt-shift-f = 'macos-native-fullscreen'

cmd-ctrl-alt-s = 'layout v_accordion'               # 'layout stacking' in i3
cmd-ctrl-alt-w = 'layout h_accordion'               # 'layout tabbed' in i3
cmd-ctrl-alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

cmd-ctrl-alt-space = 'layout floating tiling' # 'floating toggle' in i3

# Not supported, because this command is redundant in AeroSpace mental model.
# See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows


# `focus parent`/`focus child` are not yet supported, and it's not clear whether they
# should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
# alt-a = 'focus parent'

cmd-ctrl-alt-1 = 'workspace 1'
cmd-ctrl-alt-2 = 'workspace 2'
cmd-ctrl-alt-3 = 'workspace 3'
cmd-ctrl-alt-4 = 'workspace 4'
cmd-ctrl-alt-5 = 'workspace 5'
cmd-ctrl-alt-6 = 'workspace 6'
cmd-ctrl-alt-7 = 'workspace 7'
cmd-ctrl-alt-8 = 'workspace 8'
cmd-ctrl-alt-9 = 'workspace 9'
cmd-ctrl-alt-0 = 'workspace 10'
cmd-ctrl-alt-minus = 'workspace 11'
cmd-ctrl-alt-o = 'workspace o'
cmd-ctrl-alt-m = 'workspace m'
cmd-ctrl-alt-n = 'workspace .'
cmd-ctrl-alt-i = 'workspace i'
cmd-ctrl-alt-g = 'workspace g'

cmd-ctrl-alt-shift-1 = 'move-node-to-workspace 1'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace 2'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace 3'
cmd-ctrl-alt-shift-4 = 'move-node-to-workspace 4'
cmd-ctrl-alt-shift-5 = 'move-node-to-workspace 5'
cmd-ctrl-alt-shift-6 = 'move-node-to-workspace 6'
cmd-ctrl-alt-shift-7 = 'move-node-to-workspace 7'
cmd-ctrl-alt-shift-8 = 'move-node-to-workspace 8'
cmd-ctrl-alt-shift-9 = 'move-node-to-workspace 9'
cmd-ctrl-alt-shift-0 = 'move-node-to-workspace 10'
cmd-ctrl-alt-shift-minus = 'move-node-to-workspace 11
cmd-ctrl-alt-shift-o = 'move-node-to-workspace o'
cmd-ctrl-alt-shift-m = 'move-node-to-workspace m'
cmd-ctrl-alt-shift-n = 'move-node-to-workspace .'
cmd-ctrl-alt-shift-i = 'move-node-to-workspace i'
cmd-ctrl-alt-shift-g = 'move-node-to-workspace g'

cmd-alt-1 = ['move-node-to-workspace 1', 'workspace 1']
cmd-alt-2 = ['move-node-to-workspace 2', 'workspace 2']
cmd-alt-3 = ['move-node-to-workspace 3', 'workspace 3']
cmd-alt-4 = ['move-node-to-workspace 4', 'workspace 4']
cmd-alt-5 = ['move-node-to-workspace 5', 'workspace 5']
cmd-alt-6 = ['move-node-to-workspace 6', 'workspace 6']
cmd-alt-7 = ['move-node-to-workspace 7', 'workspace 7']
cmd-alt-8 = ['move-node-to-workspace 8', 'workspace 8']
cmd-alt-9 = ['move-node-to-workspace 9', 'workspace 9']
cmd-alt-0 = ['move-node-to-workspace 10', 'workspace 10']
cmd-alt-minus = ['move-node-to-workspace 11', 'workspace 11']
cmd-alt-o = ['move-node-to-workspace o', 'workspace o']
cmd-alt-m = ['move-node-to-workspace m', 'workspace m']
cmd-alt-i = ['move-node-to-workspace i', 'workspace i']
cmd-alt-n = ['move-node-to-workspace .', 'workspace .']
cmd-alt-g = ['move-node-to-workspace g', 'workspace g']
cmd-ctrl-alt-comma = ['move-workspace-to-monitor next --wrap-around']

cmd-ctrl-alt-shift-c = 'reload-config'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
cmd-ctrl-alt-shift-r = 'mode resize'
cmd-ctrl-alt-shift-s = 'mode service'
# alt-space = 'mode alt-passthrough'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height -50'
k = 'resize height +50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
b = ['balance-sizes', 'mode main']

# [mode.alt-passthrough.binding]
# alt-space = 'mode main'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace o'

